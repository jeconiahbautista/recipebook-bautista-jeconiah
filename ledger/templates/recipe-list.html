{% extends 'base.html' %}

{% block header %}
<h3>Recipe List</h3>
{% endblock %}

{% block body %}
<a href="{% url 'ledger:recipe-add' %}">Add Recipe</a>
<ul>
    {% for recipe in recipes %}
        <li><a href= "{{ recipe.get_absolute_url }}" >{{ recipe.name }}</a></li>
    {% endfor %}
</ul>
{% endblock %}
